<script>
const configured = firebaseConfig.apiKey && firebaseConfig.apiKey !== "PASTE_YOUR_API_KEY";
let db = null;

if (configured) {
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  } catch (e) {
    console.error("Firebase init failed", e);
  }
} else {
  const banner = document.createElement('div');
  banner.style.cssText = 'max-width:680px;margin:0 auto;background:#fef3e2;border-bottom:1px solid #f0d9a8;color:#8a6b2e;padding:10px 20px;font-family:system-ui,sans-serif;font-size:12px;text-align:center;';
  banner.innerHTML = '⚠️ Firebase not configured yet — data is only saving to this device. See setup instructions in the page source (view-source) to enable real sharing with your husband.';
  document.body.insertBefore(banner, document.getElementById('root'));
}

// ── Storage shim ──
// If Firebase is configured above: reads/writes go to Realtime Database,
// so both of you see the same data no matter which device you're on.
// If NOT configured yet: falls back to this device's localStorage only.
window.storage = {
  async get(key, shared) {
    if (configured && shared && db) {
      try {
        const snap = await db.ref("moveBudget/" + key).once("value");
        const value = snap.val();
        if (value === null || value === undefined) return null;
        return { key, value, shared: true };
      } catch (e) {
        console.warn("Firebase get failed, falling back to local", e);
      }
    }
    try {
      const raw = localStorage.getItem("mbp:" + key);
      if (raw === null) return null;
      return { key, value: raw, shared: !!shared };
    } catch (e) { return null; }
  },
  async set(key, value, shared) {
    if (configured && shared && db) {
      try {
        await db.ref("moveBudget/" + key).set(value);
        return { key, value, shared: true };
      } catch (e) {
        console.warn("Firebase set failed, falling back to local", e);
      }
    }
    try {
      localStorage.setItem("mbp:" + key, value);
      return { key, value, shared: !!shared };
    } catch (e) { return null; }
  },
  async delete(key, shared) {
    if (configured && shared && db) {
      try { await db.ref("moveBudget/" + key).remove(); return { key, deleted: true, shared: true }; }
      catch (e) {}
    }
    try { localStorage.removeItem("mbp:" + key); return { key, deleted: true, shared: !!shared }; }
    catch (e) { return null; }
  },
  async list(prefix, shared) {
    try {
      const keys = Object.keys(localStorage).filter(k => k.startsWith("mbp:" + (prefix || ""))).map(k => k.slice(4));
      return { keys, prefix, shared: !!shared };
    } catch (e) { return null; }
  }
};
</script>

// Rough monthly net from annual gross (married filing jointly, rough effective rates)
function annualToMonthlyNet(gross, stateTax = 0) {
  // Rough federal effective rate for married couple
  let fedRate = 0.12;
  if (gross > 190000) fedRate = 0.22;
  else if (gross > 89000) fedRate = 0.17;
  const fica = Math.min(gross, 168600) * 0.0765;
  const net = gross - (gross * fedRate) - (gross * stateTax) - fica;
  return Math.round(Math.max(0, net / 12));
}

          <span style={{ fontWeight: 600, fontSize: 13, color: "#d97706" }}>{fmt(data.budget.mortgage)}/mo</span>
        </div>
        <div style={{ ...s.row, borderBottom: "none" }}>
          <span style={s.lbl}>🏡 Parker rent estimate</span>
          <EditableNum value={data.parkerRentEstimate} onSave={v => save({ ...data, parkerRentEstimate: v })} color="#3672b5" />
        </div>
        <div style={{ textAlign: "center", padding: "14px 0 4px", borderTop: "2px solid #eee", marginTop: 4 }}>
          <div style={{ fontSize: 10, color: "#999", textTransform: "uppercase" }}>Combined Housing During Overlap</div>
          <div style={{ fontSize: 26, fontWeight: 700, color: "#c44" }}>{fmt(overlapMonthly)}/mo</div>
        </div>
        <div style={{ marginTop: 10, padding: "10px 12px", background: bridgeSurplus > 0 ? "#f0f7ed" : "#fef3e2", borderRadius: 8 }}>
          <div style={{ fontSize: 12, color: bridgeSurplus > 0 ? "#2d6e3f" : "#8a6b2e", lineHeight: 1.5 }}>
            {bridgeSurplus > 0
              ? <>Even carrying both, you'd still have <strong>{fmt(bridgeSurplus)}/mo</strong> surplus — sustainable {monthsSustainable}.</>
              : <>This overlap runs <strong>{fmt(Math.abs(bridgeSurplus))}/mo</strong> negative against your current surplus — you'd be drawing down savings, sustainable for {monthsSustainable}.</>
            }
          </div>
        </div>
      </div>

      <div style={s.secT}>🏷️ Selling via Opendoor vs. Traditional Listing</div>
      <div style={s.card}>
        <div style={{ fontSize: 11, color: "#888", marginBottom: 10, lineHeight: 1.5 }}>
          Since renting first removes the time pressure to sell fast, it's worth comparing what you'd actually walk away with each way — after paying off your {fmt(data.mortgageBalance)} mortgage balance.
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          <div style={{ background: "#fdf6ec", borderRadius: 8, padding: 12 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: "#8a6b2e", marginBottom: 6 }}>Opendoor (iBuyer)</div>
            <div style={{ fontSize: 11, color: "#7a5f2a", lineHeight: 1.6 }}>
              Offer (~2.5% below FMV, newer home): {fmt(odOffer)}<br />
              − 5% service fee: −{fmt(odServiceFee)}<br />
              − ~1% closing: −{fmt(odClosing)}<br />
              − ~1% repairs (2021 build): −{fmt(odRepairs)}<br />
              − mortgage payoff: −{fmt(data.mortgageBalance)}
            </div>
            <div style={{ fontSize: 16, fontWeight: 700, color: odNetEquity >= 0 ? "#8a6b2e" : "#a33", marginTop: 8, paddingTop: 8, borderTop: "1px solid #f0d9a8" }}>
              You get: {odNetEquity >= 0 ? fmt(odNetEquity) : `−${fmt(Math.abs(odNetEquity))}`}
            </div>
          </div>
          <div style={{ background: "#eef3fa", borderRadius: 8, padding: 12 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: "#1a3150", marginBottom: 6 }}>Traditional Listing</div>
            <div style={{ fontSize: 11, color: "#4a6a8e", lineHeight: 1.6 }}>
              Full value: {fmt(data.homeSaleValue)}<br />
              − 6% agent commission<br />
              − ~1.5% closing costs<br />
              − mortgage payoff: −{fmt(data.mortgageBalance)}
            </div>
            <div style={{ fontSize: 16, fontWeight: 700, color: traditionalNetEquity >= 0 ? "#1a3150" : "#a33", marginTop: 8, paddingTop: 8, borderTop: "1px solid #d0dcea" }}>
              You get: {traditionalNetEquity >= 0 ? fmt(traditionalNetEquity) : `−${fmt(Math.abs(traditionalNetEquity))}`}
            </div>
          </div>
        </div>
        <div style={{ textAlign: "center", marginTop: 12, padding: "10px 0 0", borderTop: "2px solid #eee" }}>
          <div style={{ fontSize: 10, color: "#999", textTransform: "uppercase" }}>Traditional Sale Nets You</div>
          <div style={{ fontSize: 22, fontWeight: 700, color: "#2d8a4e" }}>{fmt(odVsTraditional)} more</div>
          <div style={{ fontSize: 11, color: "#999", marginTop: 4 }}>{isUnderwater ? "Either way you'd owe money at closing — but traditional costs you less out of pocket." : "Since you're not in a rush anymore, the speed premium of Opendoor may not be worth this gap."}</div>
        </div>
      </div>

      <div style={s.secT}>🏦 Closing Fund</div>
      <div style={s.card}>
        <div style={{ fontSize: 11, color: "#888", marginBottom: 10, lineHeight: 1.5 }}>
          Separate from your Move Fund — this covers the potential cash-to-close gap if selling doesn't fully cover your mortgage payoff and selling costs.
        </div>
        <div style={{ textAlign: "center", marginBottom: 6 }}>
          <div style={{ fontSize: 10, color: "#999", textTransform: "uppercase" }}>Saved</div>
          <div style={{ fontSize: 30, fontWeight: 700, color: "#1a3150" }}>{fmt(data.closingFund)}</div>
        </div>
        <MountainSVG pctFill={data.closingFundGoal > 0 ? (data.closingFund / data.closingFundGoal) * 100 : 0} />
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "#999", marginTop: 2 }}>
          <span>{fmt(0)}</span><span>Goal: <EditableNum value={data.closingFundGoal} onSave={v => save({ ...data, closingFundGoal: v })} color="#1a3150" /></span>
        </div>
        <div style={{ display: "flex", gap: 10, marginTop: 14, alignItems: "center" }}>
          <input type="number" placeholder="Amount" value={closingContribAmt} onChange={e => setClosingContribAmt(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") addClosingContrib(); }}
            style={{ ...s.input, flex: 1, width: "auto", textAlign: "left" }} />
          <button onClick={addClosingContrib} style={{ ...s.btn, background: "#c44" }}>Add to Fund</button>
        </div>
        <div style={{ marginTop: 10, padding: "10px 12px", background: "#fdecec", borderRadius: 8 }}>
          <div style={{ fontSize: 11, color: "#a33" }}>
            Goal set to <strong>{fmt(data.closingFundGoal)}</strong>, matching your current estimated cash-to-close gap. Update this as you get a real payoff quote or CMA.
          </div>
        </div>
        {data.closingContributions.length > 0 && (
          <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid #f0eeea" }}>
            {data.closingContributions.slice(-8).reverse().map((c, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "5px 0", borderBottom: "1px solid #f5f3f0", fontSize: 13 }}>
                <span style={{ color: "#999" }}>{new Date(c.date).toLocaleDateString()}</span>
                <span style={{ fontWeight: 600, color: "#2d8a4e" }}>+{fmt(c.amount)}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      <div style={s.secT}>Move Fund</div>
      <div style={s.card}>
        <div style={{ textAlign: "center", marginBottom: 6 }}>
          <div style={{ fontSize: 10, color: "#999", textTransform: "uppercase" }}>Saved</div>
          <div style={{ fontSize: 34, fontWeight: 700, color: "#1a3150" }}>{fmt(data.moveFund)}</div>
        </div>
        <MountainSVG pctFill={data.moveGoal > 0 ? (data.moveFund / data.moveGoal) * 100 : 0} />
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "#999", marginTop: 2 }}>
          <span>{fmt(0)}</span><span>Goal: {fmt(data.moveGoal)}</span>
        </div>
        <div style={{ display: "flex", gap: 10, marginTop: 14, alignItems: "center" }}>
          <input type="number" placeholder="Amount" value={contribAmt} onChange={e => setContribAmt(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") addContrib(); }}
            style={{ ...s.input, flex: 1, width: "auto", textAlign: "left" }} />
          <button onClick={addContrib} style={s.btn}>Add to Fund</button>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginTop: 16, padding: "14px 0 0", borderTop: "1px solid #eee" }}>
          <div style={s.stat}><div style={{ ...s.statN, fontSize: 17, color: "#c44" }}>{fmt(remaining)}</div><div style={s.statL}>Remaining</div></div>
          <div style={s.stat}><div style={{ ...s.statN, fontSize: 17, color: "#1a3150" }}>{monthsLeft > 0 ? fmt(monthlyNeeded) : "—"}</div><div style={s.statL}>Needed/Mo</div></div>
          <div style={s.stat}><div style={{ ...s.statN, fontSize: 17, color: "#3672b5" }}>{monthsLeft}</div><div style={s.statL}>Months Left</div></div>
        </div>
      </div>

      <div style={s.secT}>Typical Move Costs (~900 mi)</div>
      <div style={s.card}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, fontSize: 12 }}>
          {[["Security deposit", "$2,000–4,000"], ["First + last rent", "$3,000–5,000"], ["Moving company", "$3,000–6,000"], ["Travel & gas", "$300–500"], ["Utility deposits", "$200–500"], ["Setup / furnishing", "$500–1,500"]].map(([l, r], i) => (
            <div key={i} style={{ background: "#f8f7f5", borderRadius: 6, padding: "8px 10px" }}>
              <div style={{ fontWeight: 600, color: "#444" }}>{l}</div>
              <div style={{ color: "#888" }}>{r}</div>
            </div>
          ))}
        </div>
        <div style={{ marginTop: 12, display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 13, fontWeight: 600 }}>Your goal:</span>
          <EditableNum value={data.moveGoal} onSave={v => save({ ...data, moveGoal: v })} color="#1a3150" />
        </div>
      </div>

      {data.contributions.length > 0 && (
        <>
          <div style={s.secT}>Contributions</div>
          <div style={s.card}>
            {data.contributions.slice(-12).reverse().map((c, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "5px 0", borderBottom: "1px solid #f5f3f0", fontSize: 13 }}>
                <span style={{ color: "#999" }}>{new Date(c.date).toLocaleDateString()}</span>
                <span style={{ fontWeight: 600, color: "#2d8a4e" }}>+{fmt(c.amount)}</span>
              </div>
            ))}
          </div>
        </>
      )}
      <div style={{ ...s.card, marginTop: 0 }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: "#1a3150", marginBottom: 6 }}>🔄 Manual Backup (Export/Import)</div>
        <div style={{ fontSize: 11, color: "#888", marginBottom: 10, lineHeight: 1.5 }}>
          If Firebase sync is set up (see page source), this happens automatically — you shouldn't need these. Keep them as a manual backup option just in case.
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={async () => {
            const json = JSON.stringify(data);
            try {
              await navigator.clipboard.writeText(json);
              alert("Copied! Now paste this into a text/email to your husband.");
            } catch (e) {
              prompt("Copy this text and send it to your husband:", json);
            }
          }} style={{ ...s.btn, flex: 1 }}>📤 Export (Copy)</button>
          <button onClick={() => {
            const pasted = prompt("Paste the exported text here:");
            if (!pasted) return;
            try {
              const parsed = JSON.parse(pasted);
              save({ ...DEFAULT, ...parsed });
              alert("Imported successfully!");
            } catch (e) {
              alert("That didn't look like valid exported data. Please check and try again.");
            }
          }} style={{ ...s.btn, flex: 1, background: "#4fa67a" }}>📥 Import (Paste)</button>
        </div>
      </div>

      <div style={{ textAlign: "center", padding: "20px 0" }}>
        <button onClick={() => { if (confirm("Reset all data to defaults?")) save(DEFAULT); }} style={{ background: "transparent", color: "#c44", border: "1px solid #c44", borderRadius: 8, padding: "8px 16px", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Reset All Data</button>
      </div>
    </div>
  );};

  return (
    <div style={s.app}>
      <div style={s.hdr}>
        <div style={s.hTitle}>Fate, TX → Colorado Springs</div>
        <div style={s.hSub}>Whitney & Family • Move Budget Planner • June 2027</div>
        <div style={s.hGrid}>
          <div style={s.hBox}><div style={s.hNum}>{daysLeft}</div><div style={s.hLbl}>Days Left</div></div>
          <div style={s.hBox}><div style={s.hNum}>{monthsLeft}</div><div style={s.hLbl}>Months</div></div>
          <div style={s.hBox}><div style={s.hNum}>{fmt(data.moveFund + data.closingFund)}</div><div style={s.hLbl}>Total Saved</div></div>
        </div>
      </div>
      <div style={s.tabs}>
        {[["budget", "Budget"], ["compare", "Compare"], ["fund", "Move Fund"]].map(([k, l]) => (
          <button key={k} style={s.tab(tab === k)} onClick={() => setTab(k)}>{l}</button>
        ))}
      </div>
      {tab === "budget" && renderBudget()}
      {tab === "compare" && renderCompare()}
      {tab === "fund" && renderFund()}
      <div style={s.footer}>Sources: ZipRecruiter, Glassdoor, Salary.com, Tax Foundation (2026) • All amounts editable</div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<div style="max-width:680px;margin:0 auto;padding:16px 20px 40px;font-family:system-ui,sans-serif;font-size:12px;color:#aaa;text-align:center;border-top:1px solid #eee;">
  This page shares data via Firebase Realtime Database once configured (see setup note at the top of the page source). Export/Import buttons below still work as a manual backup option.
</div>
</body>
</html>
