<script>
// ── Local storage shim so the app works outside Claude.ai ──
// Mirrors the window.storage.get/set API the component expects.
// Data is stored in this browser's localStorage under one shared key,
// so anyone opening this page on THIS device/browser sees the same data.
// If you and your husband each open it on your own phone/laptop, you'll
// each have your OWN separate copy (this is a static page, not a live
// synced database) — see the note at the bottom of the page for how to
// keep them in sync.
window.storage = {
  async get(key, shared) {
    try {
      const raw = localStorage.getItem("mbp:" + key);
      if (raw === null) return null;
      return { key, value: raw, shared: !!shared };
    } catch (e) { return null; }
  },
  async set(key, value, shared) {
    try {
      localStorage.setItem("mbp:" + key, value);
      return { key, value, shared: !!shared };
    } catch (e) { return null; }
  },
  async delete(key, shared) {
    try {
      localStorage.removeItem("mbp:" + key);
      return { key, deleted: true, shared: !!shared };
    } catch (e) { return null; }
  },
  async list(prefix, shared) {
    try {
      const keys = Object.keys(localStorage)
        .filter(k => k.startsWith("mbp:" + (prefix || "")))
        .map(k => k.slice(4));
      return { keys, prefix, shared: !!shared };
    } catch (e) { return null; }
  }
};
</script>

// Rough monthly net from annual gross (married filing jointly, rough effective rates)
function annualToMonthlyNet(gross, stateTax = 0) {
  // Rough federal effective rate for married couple
  let fedRate = 0.12;
  if (gross > 190000) fedRate = 0.22;
  else if (gross > 89000) fedRate = 0.17;
  const fica = Math.min(gross, 168600) * 0.0765;
  const net = gross - (gross * fedRate) - (gross * stateTax) - fica;
  return Math.round(Math.max(0, net / 12));
}

  );
}

      </div>
      {tab === "budget" && renderBudget()}
      {tab === "compare" && renderCompare()}
      {tab === "fund" && renderFund()}
      <div style={s.footer}>Sources: ZipRecruiter, Glassdoor, Salary.com, Tax Foundation (2026) • All amounts editable</div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
